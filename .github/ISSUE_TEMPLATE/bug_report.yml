name: Bug report
description: Something went wrong while reading, parsing, sending or showing a statement.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **This repository is public**: please do not paste real statements, e-mails, card numbers, names, addresses, phone numbers or e-mail addresses anywhere below. Replace them with made-up ones, such as `0001`, `张三` or `example.com`.

        Security problems go to a private report instead, as described in [SECURITY.md](https://github.com/YangMingUNSW/autobill/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `autobill --version`; it is also the last line of every e-mail.
      placeholder: autobill 0.2.0 (d4ed3e0)
    validations:
      required: true
  - type: dropdown
    id: bank
    attributes:
      label: Bank
      options:
        - Agricultural Bank of China (ABC)
        - China Construction Bank (CCB)
        - Bank of China (BOC)
        - Not about one bank
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run AutoBill?
      options:
        - Docker
        - systemd
        - uv, on my own computer
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: For example `docker compose logs --tail 50 --no-log-prefix`, with anything that identifies you removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed names, card numbers, addresses, phone numbers and e-mail addresses from everything above.
          required: true
