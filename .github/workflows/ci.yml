name: CI

# One workflow, so a pull request and a push to main each end in exactly one result, one
# notification. Lint, tests and the identity scan, gitleaks, and a build and smoke test of
# the Docker image run side by side. From main (tag "latest") and from version tags
# ("0.2.0") the image is then published to ghcr.io/yangmingunsw/autobill, only once all
# three have passed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/yangmingunsw/autobill

jobs:
  check:
    name: lint, test, identity scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag is published
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        # Coverage (a table in the log, no threshold) only on main: it doubles the time a
        # pull request waits for its result.
        run: uv run pytest ${{ github.event_name == 'push' && '--cov' || '' }}
      - name: Identity scan
        run: uv run python scripts/check_identity.py --all

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # commenting needs write access; results show in the job log

  image:
    name: build, smoke-test
    # Alongside the checks rather than after them, so a pull request's result waits for the
    # slowest job, not for the checks and then the build. Only publish waits for them all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build for this runner (amd64) to test it
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: autobill:test
          build-args: AUTOBILL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - import the samples, render the month's e-mail
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests/fixtures:/fixtures:ro" autobill:test -c '
            set -e
            test "$(id -u)" = 1000
            export AUTOBILL_DATA_DIR=/tmp/ab
            autobill import-dir /fixtures --no-send | tail -3
            autobill preview-email --cycle 2026-09 -o /tmp/p.html
            grep -q "2026年9月" /tmp/p.html
            autobill serve --help >/dev/null
          '

      - name: The image knows the commit it was built from
        run: docker run --rm autobill:test --version | grep -F "(${GITHUB_SHA::7})"

      - name: Nothing personal in the image
        run: |
          docker run --rm --entrypoint sh autobill:test -c '
            test -z "$(ls -A /data)"
            # only /opt/venv comes from the repository; nothing personal may be there
            ! find /opt/venv /home/autobill /data \( -name "*.eml" -o -name "*.db" -o -name "config.yaml" -o -name "*.env" -o -name "private-terms.txt" \) | grep .
          '

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [check, gitleaks, image]  # nothing is published from code that fails them
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build for amd64 and arm64 and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUTOBILL_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
