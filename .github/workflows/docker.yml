name: Docker image

# Builds the image on every pull request (and smoke-tests it); publishes it to
# ghcr.io/yangmingunsw/autobill from main (tag "latest") and from version tags ("0.2.0").
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yangmingunsw/autobill

jobs:
  image:
    name: build, smoke-test, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this runner (amd64) to test it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autobill:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - import the samples, print PDFs with Chinese text
        run: |
          docker run --rm --entrypoint sh -v "$PWD/tests/fixtures:/fixtures:ro" autobill:test -c '
            set -e
            test "$(id -u)" = 1000
            export AUTOBILL_DATA_DIR=/tmp/ab
            autobill import-dir /fixtures --no-send
            autobill statement --all -o /tmp/out
            test "$(ls /tmp/out/*/*.pdf | wc -l)" = 8
            python -c "
          import glob, pdfplumber
          text = pdfplumber.open(sorted(glob.glob(\"/tmp/out/ABC-0003/*.pdf\"))[0]).pages[0].extract_text()
          cjk = sum(0x4E00 <= ord(c) <= 0x9FFF for c in text)
          print(\"CJK characters on page 1:\", cjk)
          assert cjk > 20, \"Chinese text missing: fonts-noto-cjk?\"
          " 2>/dev/null
            autobill serve --help >/dev/null
          '

      - name: Nothing personal in the image
        run: |
          docker run --rm --entrypoint sh autobill:test -c '
            test -z "$(ls -A /data)"
            # only /app comes from the repository; nothing personal may be there
            ! find /app /home/autobill /data \( -name "*.eml" -o -name "*.db" -o -name "config.yaml" -o -name "*.env" -o -name "private-terms.txt" \) | grep .
          '

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build for amd64 and arm64 and publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
