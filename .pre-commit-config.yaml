# Runs before every `git commit` (enable once with: uv run pre-commit install).
# CI runs the same checks, see .github/workflows/ci.yml.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        types: [python]
        pass_filenames: false
      - id: check-identity
        name: identity scan (ID / mobile / card numbers, statement locations)
        entry: uv run --frozen python scripts/check_identity.py
        language: system

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
