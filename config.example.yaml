# AutoBill 配置示例：复制为 config.yaml 后修改（config.yaml 不入库）。
# 密码和授权码不写在这里，见 docs/security.md#密钥。

system:
  timezone: "Asia/Shanghai"          # 账单日期按北京时间理解
  data_dir: null                     # null 表示用 platformdirs 的默认位置；测试时用 AUTOBILL_DATA_DIR
  backfill_months: 12

cards:
  card_aliases:                      # 同一账户的其他卡号（换卡、一户两卡）→ 记在哪个账户下
    "CCB:5678": "CCB:1234"
  portfolio:                         # 每月应该出账的卡和大约的账单日，见 docs/notify.md#账单月进度邮件
    - { account: "ABC:0001", statement_day: 1 }    # 不写这一节时，按最近两个月出过账单的卡推算
    - { account: "CCB:0004", statement_day: 10 }
    - { account: "BOC:0005", statement_day: 22 }

banks:                               # 按银行的策略，取值依据见 docs/banks/README.md
  ABC: { due_window_days: [15, 30] } # 以后再加：dkim: verify, zero_statement: unknown
  CCB: { due_window_days: [15, 30] } # 以后再加：dkim: none,   zero_statement: unknown
  BOC: { due_window_days: [15, 30] } # 以后再加：dkim: verify, zero_statement: always

mail_fetcher:                        # 收账单的邮箱（只读），见 docs/setup.md 第 2、5 步
  enabled: false                     # 填好后改成 true
  imap_server: "imap.mail.me.com"    # iCloud
  imap_port: 993
  username: "me@icloud.com"          # 完整的 @icloud.com 主地址
  folders: ["AutoBill", "Junk"]      # 文件夹名只能用英文
  only_to: "me.bills@icloud.com"     # 只处理发给这个别名的邮件（QQ 转发到它）
  # 密码不写在这里：环境变量 AUTOBILL_IMAP_PASSWORD（iCloud 的 App 专用密码）

ai:                                  # 预留的 AI 接口：只给分类提建议，不碰解析和金额，见 docs/notify.md#分类建议与-ai-接口
  provider: null                     # 还没有可用的提供方；以后接上后写名字，比如 ollama
  model: null
  base_url: null                     # 密钥不写在这里，放环境变量 AUTOBILL_AI_API_KEY

fx:                                  # 折算人民币用的汇率，见 docs/data-model.md#汇率
  source: "https://api.frankfurter.dev/v1"   # 按账单邮件发出当天取汇率，免费、不需要 key
  fallback_to_cny: { USD: 7.10, AUD: 4.60, EUR: 7.80 }   # 联网失败时使用，报表里标注"配置汇率"

notifier:
  smtp_report:
    enabled: false                   # 填好真实邮箱后改成 true
    smtp_server: "smtp.mail.me.com"   # iCloud；QQ/163 用 465 + security: ssl
    smtp_port: 587
    security: "starttls"
    username: "me@icloud.com"
    to_addr: "me@icloud.com"          # 收报表的邮箱（作者用 iCloud 邮箱 + iPhone 苹果邮件）
  wechat_work:                       # 以后，经 Oracle 中转
    enabled: false
    relay_url: "http://10.66.66.1:8787"
    touser: "YOUR_USERID"            # 只填本人，不用 @all
