<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="AutoBill: credit-card statements, summed up in one e-mail"><title>AutoBill: credit-card statements, summed up in one e-mail</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
.name { font-weight: 700; font-size: 64px; fill: #e6edf3; letter-spacing: -1px; }
.tag { font-size: 26px; fill: #9198a1; }
.pill { font-weight: 500; font-size: 15px; fill: #e6edf3; }
.eyebrow { font-size: 16px; fill: #9198a1; }
.total { font-family: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; font-weight: 700; font-size: 46px; fill: #e6edf3; }
.cat { font-size: 16px; fill: #e6edf3; }
.pct { font-size: 16px; fill: #9198a1; font-variant-numeric: tabular-nums; }
.small { font-size: 13px; fill: #6e7681; }

.up { animation: up .8s cubic-bezier(.32,.72,0,1) both; }
.grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.3,1.35,.5,1) both; }
@keyframes up { from { opacity: 0; transform: translateY(16px); }
                to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .up, .grow, .sweep { animation: none; } }
