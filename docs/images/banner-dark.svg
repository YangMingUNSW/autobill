idth="124.4" height="36" rx="18" fill="#21262d" stroke="#3d444d"/><text class="pill" x="262.2" y="323" text-anchor="middle">Self-hosted</text><rect x="334.4" y="300" width="90.8" height="36" rx="18" fill="#21262d" stroke="#3d444d"/><text class="pill" x="379.8" y="323" text-anchor="middle">Private</text></g><g class="up" style="animation-delay:.12s"><rect x="688" y="50" width="452" height="300" rx="24" fill="#21262d" stroke="#3d444d" filter="url(#shadow)"/><text class="eyebrow" x="716" y="94">September 2026</text><text class="total" x="714" y="148">¥7,267</text><text class="eyebrow" x="716" y="176">spent this month</text><g class="up" style="animation-delay:0.55s"><circle cx="722" cy="220.5" r="5.5" fill="#3987e5"/><text class="cat" x="737" y="226">Groceries</text><text class="pct" x="940" y="226" text-anchor="end">30%</text></g><g class="up" style="animation-delay:0.63s"><circle cx="722" cy="250.5" r="5.5" fill="#d95926"/><text class="cat" x="737" y="256">Travel</text><text class="pct" x="940" y="256" text-anchor="end">28%</text></g><g class="up" style="animation-delay:0.71s"><circle cx="722" cy="280.5" r="5.5" fill="#199e70"/><text class="cat" x="737" y="286">Dining</text><text class="pct" x="940" y="286" text-anchor="end">19%</text></g><g class="up" style="animation-delay:0.79s"><circle cx="722" cy="310.5" r="5.5" fill="#c98500"/><text class="cat" x="737" y="316">Transport</text><text class="pct" x="940" y="316" text-anchor="end">11%</text></g><g mask="url(#reveal)"><circle cx="1040" cy="158" r="62" fill="none" stroke="#3987e5" stroke-width="22" stroke-dasharray="113.87 389.56" stroke-dashoffset="-0.00" transform="rotate(-90 1040 158)"/><circle cx="1040" cy="158" r="62" fill="none" stroke="#d95926" stroke-width="22" stroke-dasharray="106.08 389.56" stroke-dashoffset="-116.87" transform="rotate(-90 1040 158)"/><circle cx="1040" cy="158" r="62" fill="none" stroke="#199e70" stroke-width="22" stroke-dasharray="71.02 389.56" stroke-dashoffset="-225.94" transform="rotate(-90 1040 158)"/><circle cx="1040" cy="158" r="62" fill="none" stroke="#c98500" stroke-width="22" stroke-dasharray="39.85 389.56" stroke-dashoffset="-299.96" transform="rotate(-90 1040 158)"/><circle cx="1040" cy="158" r="62" fill="none" stroke="#8e8e93" stroke-width="22" stroke-dasharray="43.75 389.56" stroke-dashoffset="-342.81" transform="rotate(-90 1040 158)"/></g><rect class="grow" style="animation-delay:0.70s" x="973" y="278.7" width="14" height="39.3" rx="3" fill="#8e8e93" fill-opacity=".55"/><rect class="grow" style="animation-delay:0.76s" x="997" y="275.8" width="14" height="42.2" rx="3" fill="#8e8e93" fill-opacity=".55"/><rect class="grow" style="animation-delay:0.82s" x="1021" y="285.5" width="14" height="32.5" rx="3" fill="#8e8e93" fill-opacity=".55"/><rect class="grow" style="animation-delay:0.88s" x="1045" y="274.3" width="14" height="43.7" rx="3" fill="#8e8e93" fill-opacity=".55"/><rect class="grow" style="animation-delay:0.94s" x="1069" y="285.2" width="14" height="32.8" rx="3" fill="#8e8e93" fill-opacity=".55"/><rect class="grow" style="animation-delay:1.00s" x="1093" y="256.0" width="14" height="62.0" rx="3" fill="#3987e5"/><text class="small" x="973" y="338">Last 6 months</text></g></svg>
