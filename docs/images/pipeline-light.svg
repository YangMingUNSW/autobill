<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="How AutoBill works: bank e-statements arrive in your mailbox, are read without changing anything, parsed and reconciled with fixed rules, stored in SQLite on your server, summarised in CNY by category, and sent to Apple Mail."><title>How AutoBill works: bank e-statements arrive in your mailbox, are read without changing anything, parsed and reconciled with fixed rules, stored in SQLite on your server, summarised in CNY by category, and sent to Apple Mail.</title><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; text-anchor: middle; }
.step { font-weight: 600; font-size: 17px; fill: #1f2328; }
.sub { font-size: 14px; fill: #59636e; }
.node { animation: up .7s cubic-bezier(.32,.72,0,1) both; }
.flow { stroke-dasharray: 1.5 9.5; animation: flow .9s linear infinite; }
@keyframes up { from { opacity: 0; transform: translateY(12px); }
                to { opacity: 1; transform: none; } }
@keyframes flow { to { stroke-dashoffset: -11; } }
@media (prefers-reduced-motion: reduce) { .node, .flow { animation: none; } }
