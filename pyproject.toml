[project]
name = "autobill"
version = "0.3.0"
description = "Summarise Chinese credit-card statement e-mails into spending reports, using rule-based parsing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Larry Row" }]
requires-python = ">=3.12"
keywords = ["credit-card", "bank-statement", "personal-finance", "e-mail", "imap", "sqlite", "self-hosted", "apple-mail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "platformdirs>=4.11.10",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/YangMingUNSW/autobill"
Documentation = "https://github.com/YangMingUNSW/autobill/tree/main/docs"
Changelog = "https://github.com/YangMingUNSW/autobill/blob/main/CHANGELOG.md"
Issues = "https://github.com/YangMingUNSW/autobill/issues"

[project.scripts]
autobill = "autobill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "RUF", "PT", "C4", "RET"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # full-width Chinese punctuation is meant, not a lookalike
    "PT018",  # `assert a and b` keeps a test's claim on one line
    "SIM905",  # a long list of currency or country codes reads better as one string
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.coverage.run]
source = ["autobill"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
