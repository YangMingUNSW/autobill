[project]
name = "autobill"
version = "0.0.0"
description = "Summarise Chinese credit-card statement e-mails into spending reports, using rule-based parsing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Larry Row" }]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
autobill = "autobill.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
