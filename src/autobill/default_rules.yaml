# 内置分类规则（和包里的 default_rules.yaml 完全相同）。见 docs/notify.md#分类规则。
# 想补自己的规则：在数据目录新建 rules.yaml，格式和这里一样，只写你要加的。
# 你的 rules.yaml 排在前面、先匹配，这里的内置规则排在后面，照样生效。
#
# 拿每笔消费的原始描述和商户名去匹配关键词，分类从上往下，第一个匹配上的分类生效。
# 所以容易混淆的分类放前面（烟酒、旅行、住宿……），"微信/支付宝（未细分）"放最后。
# 匹配时不分大小写，也不管空格和标点："MC DONALD'S"、"SEVEN-ELEVEN" 也能匹配上。
#
# 两种关键词：
#   Woolworths      描述里任何位置出现就算（连锁品牌名、行业词用这种）
#   word:BAR        只算完整的单词：匹配 "LS BAR PLANET"，不匹配 "BARBER"（短的通用词用这种）
#
# 银行常把店名截断（"RESTAURA"、"NOODL"、"WOOLWORT"），所以很多词只写前半截。
# 每个分类先写中国大陆、澳洲和全球的连锁品牌，再写中、英、日（罗马字）等语言的行业通用词。
# 有歧义的词不放：HOTEL（澳洲的 Hotel 大多是酒吧）、METRO、SHOP、TOTAL。
# 还没分类的商户：autobill uncategorised

